[package]
name = "hospitality-os"
version = "0.1.1"
description = "Hospitality OS desktop operator"
authors = ["Xeitoso"]
edition = "2021"

[lib]
name = "hospitality_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
