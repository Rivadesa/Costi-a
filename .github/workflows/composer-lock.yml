name: Generate Composer lock

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'backend/composer.json'
      - '.github/workflows/composer-lock.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Resolve dependencies and create lock
        run: composer update --no-interaction --prefer-dist --no-install

      - name: Validate locked dependencies
        run: composer validate --strict

      - name: Upload composer.lock
        uses: actions/upload-artifact@v4
        with:
          name: hospitality-composer-lock
          path: backend/composer.lock
          if-no-files-found: error
          retention-days: 7

      - name: Commit composer.lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.lock && git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            echo 'composer.lock already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'chore: lock backend dependencies'
          git push origin HEAD:develop
