name: Local real-stack smoke test

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths: ['backend/**', 'deploy/local-test/**', '.github/workflows/local-stack-smoke.yml']
  pull_request:
    branches: [develop, main]
    paths: ['backend/**', 'deploy/local-test/**', '.github/workflows/local-stack-smoke.yml']

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for reproducible collaborator handoff
        run: git archive --format=zip --output=local-test-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: hospitality-local-source
          path: local-test-source.zip
          retention-days: 7

  docker-real-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build local test stack
        run: docker compose -f deploy/local-test/docker-compose.yml build backend
      - name: Initialize explicit test installation
        run: |
          docker compose -f deploy/local-test/docker-compose.yml up -d postgres redis
          docker compose -f deploy/local-test/docker-compose.yml run --rm backend init
          docker compose -f deploy/local-test/docker-compose.yml up -d backend
      - name: Exercise real HTTP account and service boundary
        run: python3 deploy/local-test/smoke.py create
      - name: Modify configuration before restart
        run: >-
          docker compose -f deploy/local-test/docker-compose.yml exec -T postgres
          psql -U hospitality -d hospitality -v ON_ERROR_STOP=1
          -c "UPDATE dining_tables SET name='Mesa persistente' WHERE id='01DEMO00000000000000000010';"
      - name: Repeated initialization must be a no-op
        run: docker compose -f deploy/local-test/docker-compose.yml run --rm backend init
      - name: Recreate containers without deleting persistent volumes
        run: |
          docker compose -f deploy/local-test/docker-compose.yml down
          docker compose -f deploy/local-test/docker-compose.yml up -d
      - name: Verify persisted service, account, configuration and safe retry
        run: python3 deploy/local-test/smoke.py verify
      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/local-test/docker-compose.yml logs --no-color --tail=100
      - name: Stop isolated CI test stack
        if: always()
        run: docker compose -f deploy/local-test/docker-compose.yml down -v
