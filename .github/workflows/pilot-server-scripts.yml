name: Pilot server scripts

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - 'scripts/*.ps1'
      - 'backend/routes/console.php'
      - 'backend/app/Infrastructure/Provisioning/**'
      - 'docs/PILOT_INSTALLATION.md'
      - '.github/workflows/pilot-server-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*.ps1'
      - 'backend/routes/console.php'
      - 'backend/app/Infrastructure/Provisioning/**'
      - '.github/workflows/pilot-server-scripts.yml'

jobs:
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse pilot PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell parse errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Verify scripts do not contain hard-coded pilot secrets
        shell: pwsh
        run: |
          $content = Get-Content scripts\*.ps1 -Raw
          $forbidden = @(
            'DB_PASSWORD=',
            'HOSPITALITY_PROVISION_PASSWORD='
          )
          foreach ($pattern in $forbidden) {
            if ($content -match [regex]::Escape($pattern)) {
              throw "Potential hard-coded secret assignment detected: $pattern"
            }
          }
