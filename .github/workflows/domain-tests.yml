name: Domain tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/domain-tests.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/domain-tests.yml'

jobs:
  php-domain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: PHP syntax check
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Dependency-free domain smoke tests
        run: php tests/run.php

      - name: Dependency-free projection tests
        run: php tests/projections.php

      - name: Dependency-free application tests
        run: php tests/application.php

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: composer test
