name: Backend V1A tests

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/domain-tests.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/domain-tests.yml'

jobs:
  php-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hospitality_test
          POSTGRES_USER: hospitality
          POSTGRES_PASSWORD: hospitality
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hospitality -d hospitality_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hospitality_test
      DB_USERNAME: hospitality
      DB_PASSWORD: hospitality
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_pgsql
          tools: composer:v2

      - name: PHP syntax check
        run: find app src tests database routes config bootstrap -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Dependency-free domain smoke tests
        run: php tests/run.php

      - name: Dependency-free projection tests
        run: php tests/projections.php

      - name: Dependency-free application tests
        run: php tests/application.php

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify Laravel boot and protected routes
        run: |
          php artisan --version
          php artisan route:list --path=api/v1

      - name: Run migrations
        run: php artisan migrate:fresh --force

      - name: Run PHPUnit including local auth API tests
        run: composer test

      - name: Run PostgreSQL service integration flow
        run: php tests/integration.php

      - name: Run PostgreSQL concurrency and rollback checks
        run: php tests/reliability.php

      - name: Validate Retiro demo seed
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force
