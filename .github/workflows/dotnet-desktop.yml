name: Native WPF desktop acceptance
on:
  pull_request:
    paths: ['dotnet/**', '.github/workflows/dotnet-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: dotnet/global.json}
      - name: Test typed client and uncertain retries
        run: dotnet run --project tests/Costina.ClientChecks -c Release
      - name: Instantiate and render actual WPF window
        run: dotnet run --project tests/Costina.DesktopChecks -c Release
      - name: Publish Windows client and paired local engine
        run: |
          dotnet publish src/Costina.Desktop -c Release -r win-x64 --self-contained true -o ../artifacts/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/Costina.Server -c Release -r win-x64 --self-contained true -o ../artifacts/server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record exact build manifest and complete source
        shell: pwsh
        run: |
          # La version del manifiesto sale del csproj de cada componente (F08): una sola fuente, nunca una cadena fija.
          $versions=@{desktop=([xml](Get-Content src/Costina.Desktop/Costina.Desktop.csproj)).SelectSingleNode('//Version').InnerText;
                      server=([xml](Get-Content src/Costina.Server/Costina.Server.csproj)).SelectSingleNode('//Version').InnerText}
          foreach ($component in @('desktop', 'server')) {
            $folder="../artifacts/$component"
            $base=(Resolve-Path $folder).Path
            $files=Get-ChildItem $folder -File -Recurse | ForEach-Object {
              @{path=$_.FullName.Substring($base.Length+1); sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash}
            }
            @{component=$component; version=$versions[$component]; commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; files=@($files)} | ConvertTo-Json -Depth 6 | Set-Content "$folder/build-manifest.json"
          }
          git -C .. archive -o artifacts/source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # la cuota de artefactos no decide si el corte pasa: deciden los tests
        with:
          name: costina-windows-desktop
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # la cuota de artefactos no decide si el corte pasa: deciden los tests
        with:
          name: costina-windows-server
          path: artifacts/server/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # la cuota de artefactos no decide si el corte pasa: deciden los tests
        with:
          name: costina-complete-source
          path: artifacts/source.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # la cuota de artefactos no decide si el corte pasa: deciden los tests
        if: always()
        with:
          name: costina-desktop-evidence
          path: dotnet/artifacts/desktop/
          if-no-files-found: warn
          retention-days: 14
