name: Native Windows installer
# Es el workflow mas caro (Windows, ~25 min). En una PR corre SOLO si cambia lo que el instalador empaqueta o invoca:
# deploy/windows, sus checks y los comandos de ciclo de vida del motor (setup-server, servicio, TLS, copia/restauracion).
# Todo lo demas lo cubren D0, D1 y desktop; al mezclar en develop se construye y prueba siempre el instalador de esa punta
# (el que usan los guiones fisicos), y sigue disponible a mano (workflow_dispatch).
on:
  pull_request:
    paths:
      - 'deploy/windows/**'
      - 'docs/native/D5.5-LEEME.txt'
      - 'dotnet/tests/service/**'
      - 'dotnet/src/Costina.Server/ServerSetup.cs'
      - 'dotnet/src/Costina.Server/ServiceInstaller.cs'
      - 'dotnet/src/Costina.Server/Installation.cs'
      - 'dotnet/src/Costina.Server/LocalTls.cs'
      - 'dotnet/src/Costina.Server/Backup.cs'
      - 'dotnet/src/Costina.Server/StatusReport.cs'
      - '.github/workflows/dotnet-installer.yml'
  push:
    branches: [develop]
    paths: ['dotnet/**', 'frontend/pwa/**', 'deploy/windows/**', 'docs/native/D5.5-LEEME.txt', '.github/workflows/dotnet-installer.yml', '!**/*.md']
  workflow_dispatch:
permissions:
  contents: read
# Un push nuevo a la misma PR cancela el run anterior; en develop y a mano nunca se cancela (cada punta conserva su resultado).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: dotnet/global.json}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/pwa/package-lock.json}
      - name: Build package (PWA, engine, desktop, pinned PostgreSQL) and compile the installer
        shell: pwsh
        run: ./deploy/windows/package.ps1
      - name: D5.5 real installer - install, uninstall keeping data, update with backup, client mode, new machine from backup
        shell: pwsh
        working-directory: dotnet
        run: |
          $setup = Get-ChildItem ../artifacts -Filter 'Costina-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer was not built' }
          ./tests/service/installer_checks.ps1 -Setup $setup.FullName
      - name: Upload exact executed evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true   # la cuota de artefactos no decide si el corte pasa: deciden los tests
        with:
          name: d5-installer-evidence
          path: dotnet/artifacts/installer/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the installer that was tested (unsigned trial build)
        uses: actions/upload-artifact@v4
        continue-on-error: true   # la cuota de artefactos no decide si el corte pasa: deciden los tests
        with:
          name: costina-windows-installer
          path: |
            artifacts/Costina-Setup-*.exe
            artifacts/Costina-Setup-*.json
          if-no-files-found: error
          retention-days: 5
