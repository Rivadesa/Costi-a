name: Native D1 PostgreSQL and HTTP
on:
  pull_request:
    # Una PR que solo toca Markdown no relanza nada (el filtro mira el diff de TODA la PR, no el del ultimo push).
    paths: ['dotnet/**', 'frontend/pwa/**', '.github/workflows/dotnet-d1.yml', '!**/*.md']
  workflow_dispatch:
permissions:
  contents: read
# Un push nuevo a la misma PR cancela el run anterior; a mano nunca se cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  postgres-http:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: costina
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: costina_d1_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U costina -d costina_d1_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      COSTINA_DB: 'Host=127.0.0.1;Port=5432;Database=costina_d1_test;Username=costina;Password=ci-only'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: costina
      PGPASSWORD: ci-only
      PGDATABASE: costina_d1_test
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: dotnet/global.json}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/pwa/package-lock.json}
      - name: D6.1 build and unit-test the PWA BEFORE the engine (the engine embeds frontend/pwa/dist as /app/)
        working-directory: frontend/pwa
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Build real server and restore checks
        run: |
          dotnet --info > d1-sdk.txt
          dotnet build src/Costina.Server -c Release
          dotnet build tests/Costina.PersistenceChecks -c Release
      - name: Run prior D0 acceptance
        run: dotnet run --project tests/Costina.Acceptance -c Release
      - name: Execute snapshot checks
        run: dotnet run --project tests/Costina.PersistenceChecks -c Release --no-build
      - name: Install PostgreSQL 17 client tools (pg_dump and pg_restore must match the server major version)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          echo "COSTINA_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - name: D5.1 provision roles, explicit init/upgrade and runtime least privilege (exports role connections)
        run: python3 tests/http/packaging_http.py src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: Exercise real HTTP PostgreSQL process restart and concurrency
        run: python3 tests/http/native_http.py src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: Verify endpoint authorization independent of URL casing
        run: python3 tests/http/security_http.py src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: Verify scoped desktop reads and released accounts
        run: python3 tests/http/desktop_reads.py src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: Verify domain affordances filtered per role over HTTP
        run: python3 tests/http/affordances_http.py src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: Verify guest restrictions and kitchen review protocol over HTTP
        run: python3 tests/http/restrictions_http.py src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: Verify account reopen, refunds and waiter consumptions over HTTP
        run: python3 tests/http/checkout_http.py src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: Verify users, sessions and token lifecycle over HTTP
        run: python3 tests/http/identity_http.py src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: Verify device pairing, single-use codes and revocation over HTTP
        run: python3 tests/http/pairing_http.py src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: Verify station matrix and single-use hub tickets over HTTP
        run: python3 tests/http/station_http.py src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: D6.1 PWA hosted on the same origin, money-free catalogue and a REAL browser pairing a device
        env: {COSTINA_E2E: '1'}
        run: |
          (cd ../frontend/pwa && npx playwright install --with-deps chromium)
          python3 tests/http/pwa_http.py src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: D2 realtime publisher and SignalR flow with real processes
        run: dotnet run --project tests/Costina.RealtimeChecks -c Release -- src/Costina.Server/bin/Release/net10.0/Costina.Server.dll
      - name: Upload exact executed evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true   # la cuota de artefactos no decide si el corte pasa: deciden los tests
        with:
          name: d1-postgres-http-evidence
          path: |
            dotnet/d1-http-results.json
            dotnet/d1-security-results.json
            dotnet/d1-http-server.log
            dotnet/d1-sdk.txt
            dotnet/artifacts/realtime/
          retention-days: 14
  windows-compile:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run: {working-directory: dotnet}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: dotnet/global.json}
      - name: Domain acceptance on Windows
        run: dotnet run --project tests/Costina.Acceptance -c Release
      - name: Snapshot checks on Windows
        run: dotnet run --project tests/Costina.PersistenceChecks -c Release
      - name: Publish Windows service binary (not an installer)
        run: dotnet publish src/Costina.Server -c Release -r win-x64 --self-contained true -o ../artifacts/d1-server
      - name: Record build and hashes
        shell: pwsh
        run: |
          $manifest = @{commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; sdk=(dotnet --version); kind='engineering-server-not-installer'; files=@()}
          Get-ChildItem ../artifacts/d1-server -File -Recurse | ForEach-Object {
            $manifest.files += @{file=$_.FullName.Substring((Resolve-Path ../artifacts/d1-server).Path.Length+1); sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash}
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content ../artifacts/d1-server/build-manifest.json
      - name: Archive tracked source for reproducible handoff
        run: git archive -o ../artifacts/d1-source.zip HEAD
      # El binario del servidor NO se sube aqui: es el mismo que costina-windows-server (workflow de escritorio) y el del
      # instalador. Se publica solo como comprobacion de compilacion; subirlo tres veces agoto la cuota de artefactos.
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # la cuota de artefactos no decide si el corte pasa: deciden los tests
        with:
          name: costina-d1-source
          path: artifacts/d1-source.zip
          if-no-files-found: error
          retention-days: 14
  windows-service:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run: {working-directory: dotnet}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: dotnet/global.json}
      - name: Publish the engine into Program Files (program separate from data)
        shell: pwsh
        run: |
          dotnet publish src/Costina.Server -c Release -r win-x64 --self-contained true -o "$env:ProgramFiles\Costina"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: D5.2 real Windows service - virtual account, ACL, no user session, restart and recovery
        shell: pwsh
        run: ./tests/service/service_checks.ps1 -Program "$env:ProgramFiles\Costina"
      - name: Upload exact executed evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true   # la cuota de artefactos no decide si el corte pasa: deciden los tests
        with:
          name: d5-windows-service-evidence
          path: dotnet/artifacts/service/
          if-no-files-found: warn
          retention-days: 14
