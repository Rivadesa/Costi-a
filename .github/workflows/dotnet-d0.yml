name: Native D0 domain acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths: ['dotnet/**', '.github/workflows/dotnet-d0.yml']
  push:
    branches: [develop, main]
    paths: ['dotnet/**', '.github/workflows/dotnet-d0.yml']
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  native-domain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: dotnet/global.json
      - name: Record actual SDK and build context
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/d0 | Out-Null
          dotnet --info | Tee-Object -FilePath artifacts/d0/sdk-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ commit = $env:GITHUB_SHA; workflowRun = $env:GITHUB_RUN_ID; os = $env:RUNNER_OS } | ConvertTo-Json | Set-Content artifacts/d0/build-context.json
      - name: Build domain, planner and acceptance runner
        run: dotnet build Costina.slnx --configuration Release
      - name: Execute acceptance scenarios (nonzero exit on failure)
        run: dotnet run --project tests/Costina.Acceptance --configuration Release --no-build -- artifacts/d0
      - name: Publish executed results and SDK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d0-acceptance-${{ matrix.os }}
          path: dotnet/artifacts/d0/
          if-no-files-found: warn
          retention-days: 14
