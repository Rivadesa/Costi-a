openapi: 3.1.0
info:
  title: Hospitality OS V1A Local API
  version: 0.5.0
  description: >-
    Local-primary API consumed by the Tauri desktop operator, waiter clients and KDS.
    Authentication is local and does not require Internet. Authenticated context determines
    tenant/company/location; clients must not be trusted to select an unauthorized scope.
    All operational mutations use Idempotency-Key so retries are safe.
servers:
  - url: http://hospitality.local/api/v1
security:
  - bearerAuth: []
paths:
  /meta:
    get:
      security: []
      summary: Backend identity and phase
      responses:
        '200': { description: OK }
  /auth/login:
    post:
      security: []
      summary: Create a local authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: [string, 'null'] }
                company_id:
                  type: [string, 'null']
                  description: Optional only when the local server is not fixed to one company.
                location_id:
                  type: [string, 'null']
                  description: Optional only when the local server is not fixed to one location.
      responses:
        '200': { description: Access token and authenticated principal }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidArgument' }
  /auth/me:
    get:
      summary: Current local principal, scope and permissions
      responses:
        '200': { description: Authenticated principal }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      summary: Revoke current local token
      responses:
        '200': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /configuration:
    get:
      summary: Human-readable operational catalog for the authorized location
      description: Returns active dining tables, menu templates and kitchen stations for UI use.
      responses:
        '200': { description: Tables, menus and stations }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /service-board:
    get:
      summary: Global active-service projection for chef/maître
      responses:
        '200': { description: Active service overview }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /kds/stations/{stationId}:
    get:
      summary: Active KDS queue for one kitchen station
      parameters:
        - $ref: '#/components/parameters/stationId'
      responses:
        '200': { description: Station queue }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /services:
    post:
      summary: Atomically open a prepared table service
      description: >-
        Creates the service, snapshots the optional menu and creates every PAX position in one
        PostgreSQL transaction. A network interruption cannot leave the initial service half configured.
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table_id, pax]
              properties:
                table_id: { type: string, maxLength: 26 }
                pax: { type: integer, minimum: 1, maximum: 100 }
                menu_id: { type: [string, 'null'], maxLength: 26 }
      responses:
        '201': { description: Prepared service opened }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidArgument' }
  /services/{serviceId}:
    get:
      summary: Complete service projection for operator/comandero
      parameters:
        - $ref: '#/components/parameters/serviceId'
      responses:
        '200': { description: Service detail }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/menu:
    post:
      summary: Assign a configured menu to an existing service
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menu_id]
              properties:
                menu_id: { type: string, maxLength: 26 }
      responses:
        '200': { description: Menu assigned }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/guests:
    post:
      summary: Add a guest/PAX position to a legacy or incomplete service
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, 'null'], maxLength: 160 }
      responses:
        '200': { description: Guest added }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/guests/{guestId}/restrictions:
    post:
      summary: Add structured allergy, intolerance or preference to one PAX
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/guestId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, type, severity]
              properties:
                label: { type: string, maxLength: 160 }
                type: { enum: [allergy, intolerance, preference] }
                severity: { enum: [informative, important, critical] }
                notes: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200': { description: Restriction added }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/start:
    post:
      summary: Start service after menu assignment
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Service started }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/pause:
    post:
      summary: Pause table pacing
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200': { description: Paused }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/resume:
    post:
      summary: Resume table pacing
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Resumed }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/fire-next:
    post:
      summary: Fire the next pending course
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Course fired }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/items/{itemId}/start:
    post:
      summary: Start one station preparation
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/itemId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Preparation started }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/items/{itemId}/ready:
    post:
      summary: Mark one station preparation ready
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/itemId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Preparation ready }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/ready:
    post:
      summary: Chef/pass validates the complete course ready
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Course ready }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/serve:
    post:
      summary: Mark complete course served
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Course served }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/skip:
    post:
      summary: Skip one course with a mandatory reason
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Course skipped }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/consumptions:
    post:
      summary: Add drink or extra to the provisional account
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, quantity, unit_price_cents]
              properties:
                name: { type: string, maxLength: 180 }
                quantity: { type: integer, minimum: 1, maximum: 999 }
                unit_price_cents: { type: integer, minimum: 0 }
      responses:
        '200': { description: Consumption added }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/consumptions/{consumptionId}/cancel:
    post:
      summary: Cancel a consumption without destructive deletion
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/consumptionId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Consumption cancelled }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/payments:
    post:
      summary: Record operational payment; this is not a fiscal document
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount_cents]
              properties:
                method: { type: string, maxLength: 40 }
                amount_cents: { type: integer, minimum: 1 }
      responses:
        '200': { description: Payment recorded }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/close:
    post:
      summary: Close a fully paid service with no active kitchen course
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Service closed }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-token
  parameters:
    idempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 120 }
    serviceId:
      in: path
      name: serviceId
      required: true
      schema: { type: string }
    guestId:
      in: path
      name: guestId
      required: true
      schema: { type: string }
    courseId:
      in: path
      name: courseId
      required: true
      schema: { type: string }
    itemId:
      in: path
      name: itemId
      required: true
      schema: { type: string }
    stationId:
      in: path
      name: stationId
      required: true
      schema: { type: string }
    consumptionId:
      in: path
      name: consumptionId
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing, invalid, expired or revoked local session
    Forbidden:
      description: Authenticated user lacks permission for this operation or scope
    Conflict:
      description: Domain, idempotency or optimistic-concurrency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidArgument:
      description: Request validation or invalid argument error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        errors: { type: object, additionalProperties: true }
