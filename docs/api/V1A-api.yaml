openapi: 3.1.0
info:
  title: Hospitality OS V1A Local API
  version: 0.2.0
  description: >-
    Local-primary API consumed by Tauri desktop, waiter PWA and KDS.
    Mutation endpoints that may be retried accept Idempotency-Key.
servers:
  - url: http://hospitality.local/api/v1
paths:
  /services:
    get:
      summary: List active services for current authorized location
      responses:
        '200': { description: OK }
    post:
      summary: Open a table service
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table_id, pax]
              properties:
                table_id: { type: string }
                pax: { type: integer, minimum: 1 }
                menu_id: { type: [string, 'null'] }
      responses:
        '201': { description: Service created }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}:
    get:
      summary: Get complete service projection
      parameters:
        - $ref: '#/components/parameters/serviceId'
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /services/{serviceId}/start:
    post:
      summary: Start service
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Started }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/guests:
    post:
      summary: Add a guest position
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, 'null'] }
      responses:
        '201': { description: Guest created }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/guests/{guestId}/restrictions:
    post:
      summary: Add structured allergy, intolerance or preference
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/guestId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, type, severity]
              properties:
                label: { type: string }
                type: { enum: [allergy, intolerance, preference] }
                severity: { enum: [informative, important, critical] }
                notes: { type: [string, 'null'] }
      responses:
        '201': { description: Restriction created }
  /services/{serviceId}/courses/next/fire:
    post:
      summary: Fire the next pending course
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Course fired }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/items/{itemId}/start:
    post:
      summary: Start one station preparation
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/itemId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Preparation started }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/items/{itemId}/ready:
    post:
      summary: Mark one station preparation ready
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/itemId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Preparation ready }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/items/{itemId}/substitute:
    post:
      summary: Substitute one preparation in this service only
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/itemId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, station_id, reason]
              properties:
                name: { type: string }
                station_id: { type: string }
                reason: { type: string }
      responses:
        '200': { description: Preparation substituted }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/ready:
    post:
      summary: Chef/pass validates complete course ready
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Course ready }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/serve:
    post:
      summary: Mark complete course served
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Course served }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/skip:
    post:
      summary: Skip course for this service with reason
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Course skipped }
  /services/{serviceId}/pause:
    post:
      summary: Pause table pacing
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Paused }
  /services/{serviceId}/resume:
    post:
      summary: Resume table pacing
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Resumed }
  /services/{serviceId}/consumptions:
    post:
      summary: Add drink or extra to provisional account
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, quantity, unit_price_cents]
              properties:
                name: { type: string }
                quantity: { type: integer, minimum: 1 }
                unit_price_cents: { type: integer, minimum: 0 }
      responses:
        '201': { description: Consumption added }
  /services/{serviceId}/consumptions/{consumptionId}/cancel:
    post:
      summary: Cancel a consumption without destructive deletion
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - in: path
          name: consumptionId
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Consumption cancelled }
  /services/{serviceId}/payments:
    post:
      summary: Record operational payment (not a fiscal document)
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount_cents]
              properties:
                method: { type: string }
                amount_cents: { type: integer, minimum: 1 }
      responses:
        '201': { description: Payment recorded }
  /services/{serviceId}/close:
    post:
      summary: Close paid service with no active kitchen course
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Closed }
        '409': { $ref: '#/components/responses/Conflict' }
  /kds/stations/{stationId}/queue:
    get:
      summary: Get active preparation queue for one station
      parameters:
        - in: path
          name: stationId
          required: true
          schema: { type: string }
      responses:
        '200': { description: KDS queue }
  /service-board:
    get:
      summary: Global service board for chef/maître
      responses:
        '200': { description: Current service overview }
components:
  parameters:
    serviceId:
      in: path
      name: serviceId
      required: true
      schema: { type: string }
    guestId:
      in: path
      name: guestId
      required: true
      schema: { type: string }
    courseId:
      in: path
      name: courseId
      required: true
      schema: { type: string }
    itemId:
      in: path
      name: itemId
      required: true
      schema: { type: string }
    idempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 120 }
  responses:
    Conflict:
      description: Domain state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
