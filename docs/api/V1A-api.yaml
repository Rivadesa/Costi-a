openapi: 3.1.0
info:
  title: Hospitality OS V1A Local API
  version: 0.3.0
  description: >-
    Local-primary API consumed by Tauri desktop, waiter clients and KDS.
    All mutation endpoints require Idempotency-Key. Tenant/company/location headers
    are temporary V1A context inputs until local authentication/role scoping is completed.
servers:
  - url: http://hospitality.local/api/v1
parameters: {}
paths:
  /meta:
    get:
      summary: Backend identity and phase
      responses:
        '200': { description: OK }
  /service-board:
    get:
      summary: Global active-service projection for chef/maître
      parameters:
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      responses:
        '200': { description: Active service overview }
        '409': { $ref: '#/components/responses/Conflict' }
  /kds/stations/{stationId}:
    get:
      summary: Active KDS queue for one kitchen station
      parameters:
        - $ref: '#/components/parameters/stationId'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      responses:
        '200': { description: Station queue }
        '409': { $ref: '#/components/responses/Conflict' }
  /services:
    post:
      summary: Open a table service
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table_id, pax]
              properties:
                table_id: { type: string, maxLength: 26 }
                pax: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '201': { description: Service opened }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidArgument' }
  /services/{serviceId}:
    get:
      summary: Complete service projection for comandero/operator
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      responses:
        '200': { description: Service detail }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/menu:
    post:
      summary: Assign configured menu template and snapshot its execution
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menu_id]
              properties:
                menu_id: { type: string, maxLength: 26 }
      responses:
        '200': { description: Menu assigned }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/guests:
    post:
      summary: Add a guest/PAX position
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, 'null'], maxLength: 160 }
      responses:
        '200': { description: Guest added }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/guests/{guestId}/restrictions:
    post:
      summary: Add structured allergy, intolerance or preference to one PAX
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/guestId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, type, severity]
              properties:
                label: { type: string, maxLength: 160 }
                type: { enum: [allergy, intolerance, preference] }
                severity: { enum: [informative, important, critical] }
                notes: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200': { description: Restriction added }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/start:
    post:
      summary: Start service after menu assignment
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      responses:
        '200': { description: Started }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/pause:
    post:
      summary: Pause table pacing
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200': { description: Paused }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/resume:
    post:
      summary: Resume table pacing
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      responses:
        '200': { description: Resumed }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/fire-next:
    post:
      summary: Fire the next pending course
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      responses:
        '200': { description: Course fired }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/items/{itemId}/start:
    post:
      summary: Start one station preparation
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/itemId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      responses:
        '200': { description: Preparation started }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/items/{itemId}/ready:
    post:
      summary: Mark one station preparation ready
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/itemId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      responses:
        '200': { description: Preparation ready }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/ready:
    post:
      summary: Chef/pass validates the complete course ready
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      responses:
        '200': { description: Course ready }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/serve:
    post:
      summary: Mark complete course served
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      responses:
        '200': { description: Course served }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/courses/{courseId}/skip:
    post:
      summary: Skip one course with mandatory reason
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/courseId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Course skipped }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/consumptions:
    post:
      summary: Add drink/extra to the provisional account
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, quantity, unit_price_cents]
              properties:
                name: { type: string, maxLength: 180 }
                quantity: { type: integer, minimum: 1, maximum: 999 }
                unit_price_cents: { type: integer, minimum: 0 }
      responses:
        '200': { description: Consumption added }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/consumptions/{consumptionId}/cancel:
    post:
      summary: Cancel a consumption without deleting audit history
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/consumptionId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Consumption cancelled }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/payments:
    post:
      summary: Record operational payment (not a fiscal document)
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount_cents]
              properties:
                method: { type: string, maxLength: 40 }
                amount_cents: { type: integer, minimum: 1 }
      responses:
        '200': { description: Payment recorded }
        '409': { $ref: '#/components/responses/Conflict' }
  /services/{serviceId}/close:
    post:
      summary: Close a fully paid service with no active kitchen course
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/tenantId'
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/locationId'
      responses:
        '200': { description: Service closed }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  parameters:
    tenantId:
      in: header
      name: X-Tenant-Id
      required: false
      description: Required unless fixed by HOSPITALITY_TENANT_ID on the local server. Temporary until Issue #5 authentication.
      schema: { type: string }
    companyId:
      in: header
      name: X-Company-Id
      required: false
      description: Required unless fixed by HOSPITALITY_COMPANY_ID on the local server.
      schema: { type: string }
    locationId:
      in: header
      name: X-Location-Id
      required: false
      description: Required unless fixed by HOSPITALITY_LOCATION_ID on the local server.
      schema: { type: string }
    idempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 120 }
    serviceId:
      in: path
      name: serviceId
      required: true
      schema: { type: string }
    guestId:
      in: path
      name: guestId
      required: true
      schema: { type: string }
    courseId:
      in: path
      name: courseId
      required: true
      schema: { type: string }
    itemId:
      in: path
      name: itemId
      required: true
      schema: { type: string }
    stationId:
      in: path
      name: stationId
      required: true
      schema: { type: string }
    consumptionId:
      in: path
      name: consumptionId
      required: true
      schema: { type: string }
  responses:
    Conflict:
      description: Domain, idempotency or optimistic-concurrency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidArgument:
      description: Invalid command argument/context
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error, message, retryable]
      properties:
        error:
          type: string
          enum: [domain_conflict, idempotency_conflict, concurrency_conflict, invalid_argument]
        message: { type: string }
        retryable: { type: boolean }
